<style>
:root{
  --bg:#0b0c10; --surface:#12141a; --surface2:#181b23; --raise:#1e222b; --line:#252a34; --line2:#30363f;
  --ink:#eceef2; --muted:#a2a8b4; --faint:#6c7380;
  --mint:#2ed3b7; --mint-ink:#062a24; --mint-soft:rgba(46,211,183,.12);
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --r:14px; --r-sm:10px;
  --f:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--mint)}
:focus-visible{outline:2px solid var(--mint);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* layout */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--mint),#3b82f6);display:grid;place-items:center;font-weight:800;color:#04201b;font-size:13px;flex:none}
.brand .t{min-width:0}
.brand .t b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .t span{font-size:12px;color:var(--faint)}
.navlabel{font-size:11px;letter-spacing:.08em;color:var(--faint);padding:14px 10px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface2);color:var(--ink)}
.nav a.on{background:var(--raise);color:var(--ink)}
.nav .dot{width:8px;height:8px;border-radius:50%;flex:none}
.nav .me{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--mint-ink);background:var(--mint);padding:1px 6px;border-radius:5px}
.nav .ico{width:18px;text-align:center;color:var(--faint);flex:none}
.side-foot{margin-top:auto;padding:12px 8px 4px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.side-foot label{font-size:11.5px;color:var(--faint)}
.side-foot select{background:var(--surface2);border:1px solid var(--line2);border-radius:9px;padding:8px 10px}
.main{min-width:0;padding:28px clamp(16px,4vw,44px) 80px}
.topbar{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:40;transform:translateX(-102%);transition:transform .2s}
  .side.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}
  .topbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;background:rgba(11,12,16,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
  .topbar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .main{padding-top:20px}
}

/* type */
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--faint);display:flex;gap:8px;align-items:center}
h1{font-size:clamp(24px,3.4vw,32px);line-height:1.2;margin:6px 0 6px;letter-spacing:-.02em;font-weight:750;text-wrap:balance}
h2{font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
.lead{color:var(--muted);margin:0;max-width:68ch}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.pagehead{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.pagehead .acts{display:flex;gap:8px;flex-wrap:wrap}
.sechead{display:flex;align-items:center;gap:10px;margin:30px 0 12px;flex-wrap:wrap}
.sechead .sp{flex:1}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface2);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:var(--faint)}
.btn-p{background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}
.btn-p:hover{filter:brightness(1.07)}
.btn-g{background:transparent;border-color:transparent;color:var(--muted)}
.btn-g:hover{color:var(--ink);background:var(--surface2)}
.btn-d{background:transparent;color:var(--bad);border-color:rgba(248,113,113,.4)}
.btn-sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--raise);color:var(--muted);white-space:nowrap;border:1px solid transparent}
.chip.c-ok{background:rgba(74,222,128,.12);color:var(--ok)}
.chip.c-warn{background:rgba(251,191,36,.12);color:var(--warn)}
.chip.c-bad{background:rgba(248,113,113,.12);color:var(--bad)}
.chip.c-mint{background:var(--mint-soft);color:var(--mint)}
.chip.c-line{background:transparent;border-color:var(--line2)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{background:none;border:0;padding:10px 14px;color:var(--faint);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--pc,var(--mint))}
.tab .n{font-size:11.5px;color:var(--faint);margin-left:4px;font-weight:500}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;margin-bottom:20px;font-size:13.5px}
.banner b{font-weight:700}
.banner .sp{flex:1}
.lock{border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.06)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
@media (max-width:520px){.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:19px}}
.kpi{padding:16px 18px}
.kpi .l{font-size:12.5px;color:var(--faint);font-weight:600}
.kpi .v{font-size:24px;font-weight:750;letter-spacing:-.02em;margin-top:4px}
.kpi .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.hero{padding:26px 28px;background:radial-gradient(120% 140% at 100% 0%,rgba(46,211,183,.10),transparent 55%),var(--surface)}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.syn{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.syn{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.syn{grid-template-columns:minmax(0,1fr)}}
.syn .card{padding:16px}
.syn .k{font-size:12px;font-weight:700;color:var(--mint);letter-spacing:.04em}
.syn p{margin:6px 0 0;white-space:pre-wrap;word-break:break-word}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pcard{padding:18px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;border-top:3px solid var(--pc)}
.pcard:hover{border-color:var(--line2);border-top-color:var(--pc);background:var(--surface2)}
.pcard .h{display:flex;align-items:center;gap:8px}
.pcard .h b{font-size:16px}
.pcard .secs{font-size:12.5px;color:var(--faint)}
.pcard .f{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.empty{border:1.5px dashed var(--line2);border-radius:var(--r);padding:36px 20px;text-align:center;color:var(--faint)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .btn{margin-top:14px}
.text-block{padding:18px 20px;white-space:pre-wrap;word-break:break-word}

/* grid / gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.gcard{overflow:hidden;display:flex;flex-direction:column;cursor:pointer;text-align:left;padding:0;width:100%}
.gcard:hover{border-color:var(--line2)}
.cover{aspect-ratio:4/3;background:var(--surface2);display:grid;place-items:center;overflow:hidden;color:var(--faint);font-size:12px;border-bottom:1px solid var(--line)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.contain img{object-fit:contain;background:#0e0f13}
.cover .ph{font-size:28px;font-weight:800;color:var(--line2)}
.gbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px}
.gbody .t{font-weight:700;font-size:15px;line-height:1.35}
.gbody .chips{display:flex;flex-wrap:wrap;gap:4px}
.gbody .ln{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.gbody .mt{font-size:12px;color:var(--faint)}
.mood{columns:4 220px;column-gap:12px}
.mood .m{break-inside:avoid;margin-bottom:12px;position:relative;border-radius:12px;overflow:hidden;cursor:pointer;background:var(--surface2);border:1px solid var(--line);display:block;width:100%;padding:0}
.mood img{width:100%;display:block}
.mood .cap{position:absolute;left:0;right:0;bottom:0;padding:24px 12px 10px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:13px;font-weight:600;text-align:left}
.mood .noimg{aspect-ratio:1;display:grid;place-items:center;color:var(--faint)}
.palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.sw{overflow:hidden;cursor:pointer;padding:0;text-align:left;width:100%}
.sw .c{height:110px}
.sw .i{padding:10px 12px}
.sw .i b{display:block}
.sw .i span{font-size:12px;color:var(--faint);text-transform:uppercase}

/* storyboard */
.scene{margin-bottom:22px}
.scene-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.scene-h .sn{font-size:20px;font-weight:800;color:var(--pc);letter-spacing:-.01em}
.scene-h .st{font-weight:700}
.scene-h .sp{flex:1}
.cuts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.cut{overflow:hidden;cursor:pointer;padding:0;text-align:left;width:100%;display:flex;flex-direction:column}
.cut:hover{border-color:var(--line2)}
.frame{background:var(--surface2);display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line);position:relative}
.frame img{width:100%;height:100%;object-fit:cover}
.frame .cn{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);padding:1px 8px;border-radius:6px;font-size:12px;font-weight:700}
.frame .ph{font-size:12px;color:var(--faint)}
.cut .b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.cut .tags{display:flex;gap:4px;flex-wrap:wrap}
.cut .tx{font-size:13.5px}
.cut .dl{font-size:12.5px;color:var(--muted);font-style:italic;white-space:pre-wrap}
.cut .ft{display:flex;justify-content:space-between;font-size:12px;color:var(--faint)}

/* table */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;color:var(--faint);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--surface2)}
td.r,th.r{text-align:right;white-space:nowrap}
tr.grp td{background:var(--bg);font-weight:700;font-size:12.5px;color:var(--muted);padding:8px 14px}
tr.tot td{font-weight:700;background:var(--surface2)}
td .sub{display:block;font-size:12px;color:var(--faint);margin-top:2px;white-space:pre-wrap}

/* board */
.board{display:grid;grid-template-columns:repeat(var(--cols,3),minmax(220px,1fr));gap:12px;overflow-x:auto}
.bcol{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:100px}
.bcol h3{margin:4px 6px 4px;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between}
.bitem{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;text-align:left;width:100%;display:flex;flex-direction:column;gap:5px}
.bitem:hover{border-color:var(--line2)}
.bitem .mt{font-size:12px;color:var(--faint);display:flex;gap:8px;flex-wrap:wrap}

/* schedule */
.sched{display:flex;flex-direction:column;gap:10px}
.call{display:grid;grid-template-columns:120px minmax(0,1fr);overflow:hidden;cursor:pointer;text-align:left;padding:0;width:100%}
.call:hover{border-color:var(--line2)}
.call .d{background:var(--surface2);padding:14px;display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line)}
.call .d b{font-size:20px;letter-spacing:-.02em}
.call .i{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.call .row2{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.call.past{opacity:.5}
@media (max-width:560px){.call{grid-template-columns:minmax(0,1fr)}.call .d{border-right:0;border-bottom:1px solid var(--line);flex-direction:row;gap:10px;align-items:baseline}}

/* budget */
.bud-row{display:grid;grid-template-columns:120px minmax(0,1fr) 130px 130px 130px;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.bud-row:last-child{border-bottom:0}
.bud-row.h{font-size:12px;color:var(--faint);font-weight:600;padding-top:12px;padding-bottom:10px}
.bud-row .p{display:flex;gap:8px;align-items:center;font-weight:700}
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bud-row input{width:100%;background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:6px 8px;text-align:right}
@media (max-width:760px){.bud-row{grid-template-columns:1fr 1fr}.bud-row .barc{grid-column:1/-1;order:5}.bud-row.h{display:none}}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:60;display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);height:100%;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column}
.drawer header{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.drawer header h3{margin:0;font-size:16px;flex:1}
.drawer .body{flex:1;overflow:auto;padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:14px 14px;align-content:start}
.drawer footer{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);padding-bottom:max(14px,env(safe-area-inset-bottom))}
.drawer footer .sp{flex:1}
.fd{display:flex;flex-direction:column;gap:6px;min-width:0}
.fd.full{grid-column:1/-1}
.fd>label,.fd>.lb{font-size:12.5px;font-weight:600;color:var(--muted)}
.fd input,.fd select,.fd textarea{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
.fd input:focus,.fd select:focus,.fd textarea:focus{outline:none;border-color:var(--mint)}
.fd textarea{min-height:88px;resize:vertical;line-height:1.5}
.fd .hint{font-size:11.5px;color:var(--faint)}
.fd .prev{border-radius:10px;overflow:hidden;border:1px solid var(--line);max-height:220px;display:grid;place-items:center;background:var(--bg)}
.fd .prev img{max-width:100%;max-height:220px;display:block}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.picks button{border:1px solid var(--line2);background:var(--bg);border-radius:8px;padding:5px 10px;font-size:13px;color:var(--muted)}
.picks button.on{border-color:var(--mint);background:var(--mint-soft);color:var(--mint);font-weight:700}
.colorrow{display:flex;gap:8px}
.colorrow input[type=color]{width:52px;padding:2px;height:40px}
.ro{grid-column:1/-1;display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 14px;font-size:14px}
.ro dt{color:var(--faint);font-size:13px}
.ro dd{margin:0;white-space:pre-wrap;word-break:break-word}
.ro img{max-width:100%;border-radius:10px}
@media (max-width:560px){.drawer .body{grid-template-columns:minmax(0,1fr)}.ro{grid-template-columns:minmax(0,1fr)}}

/* landing */
.land{max-width:760px;margin:0 auto;padding:clamp(40px,8vh,90px) 20px 60px}
.land h1{font-size:clamp(30px,5vw,44px)}
.land .newp{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.land .newp input{flex:1 1 260px;background:var(--surface);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;font-size:15px}
.land .btn{padding:12px 18px;font-size:14.5px;border-radius:12px}
.recent{margin-top:40px}
.recent a{display:flex;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.recent a:hover{background:var(--surface2)}
.recent a span{color:var(--faint);font-size:13px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:40px}
.feat div{padding:14px 16px;font-size:13px;color:var(--muted)}
.feat b{display:block;color:var(--ink);margin-bottom:2px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--raise);border:1px solid var(--line2);padding:10px 16px;border-radius:12px;z-index:90;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4)}
.guide ol{padding-left:20px;margin:0;display:flex;flex-direction:column;gap:10px}
.guide code{background:var(--bg);border:1px solid var(--line);padding:1px 6px;border-radius:6px;font-size:12.5px}
</style>
</head>
<body>
<div id="root"></div>

<script>
(function(){
'use strict';

/* ============================================================
   양식 정의 — 파트와 섹션, 입력 칸을 여기서 바꿀 수 있어요.
   ============================================================ */
const f = (k, l, t = 'text', o = {}) => ({ k, l, t, ...o });
const SIZES = ['ECU','CU','MCU','MS','KS','FS','LS','ELS','설정샷','인서트','OTS','POV','투샷'];
const ANGLES = ['아이레벨','하이앵글','로우앵글','버드아이','더치앵글'];
const MOVES = ['고정','팬','틸트','줌인','줌아웃','달리인','달리아웃','트래킹','핸드헬드','짐벌','슬라이더','드론'];
const TOD = ['낮 · 실내','낮 · 실외','밤 · 실내','밤 · 실외','새벽','노을'];
const MONEY_STATUS = ['논의 중','확정','취소'];

function moneyFields(cats, extra = []) {

const $root = document.getElementById('root');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (Math.round(Number(n)||0)).toLocaleString('ko-KR') + '원';
const LS = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const parseD = s => { if(!s) return null; const [y,m,d] = String(s).split('-').map(Number); return y ? new Date(y, m-1, d) : null; };
const dday = s => { const d = parseD(s); if(!d) return ''; const n = Math.round((d - today())/864e5); return n === 0 ? 'D-DAY' : n > 0 ? 'D-' + n : 'D+' + (-n); };
const fmtD = s => { const d = parseD(s); if(!d) return ''; return (d.getMonth()+1) + '.' + String(d.getDate()).padStart(2,'0') + ' (' + '일월화수목금토'[d.getDay()] + ')'; };
const mmss = s => { s = Math.round(Number(s)||0); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); };
const uid = (n=10) => { const a = 'abcdefghijkmnpqrstuvwxyz23456789'; let s=''; const r = crypto.getRandomValues(new Uint8Array(n)); for(const x of r) s += a[x % a.length]; return s; };
const arr = v => Array.isArray(v) ? v : (v ? [v] : []);
function imgUrl(u){
  u = String(u||'').trim(); if(!/^https?:\/\//i.test(u)) return '';
  const m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]{10,})/);
  if(m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1600';
  return u;

/* ============================================================
   저장소 — Firebase가 있으면 Firestore, 없으면 이 브라우저(미리보기)
   ============================================================ */
const CFG = window.FIREBASE_CONFIG || {};
const LIVE = !!(CFG.apiKey && CFG.projectId);

function LocalStore(pid){
  const key = 'board:' + pid;
  let db = LS.get(key);
  let cb = () => {};
  const save = () => { LS.set(key, db); cb(clone()); };
  const clone = () => ({ project: db.project, entries: Object.entries(db.entries).map(([id,e]) => ({id, ...e})) });
  return {
    async exists(){ return !!db; },
    async create(project, seed){ db = { project, entries:{} }; for(const s of seed) db.entries[uid(12)] = { ...s, createdAt: Date.now() }; save(); },
    listen(fn){ cb = fn; if(db) setTimeout(()=>cb(clone())); return ()=>{}; },
    async setProject(patch){ db.project = { ...db.project, ...patch }; save(); },
    async add(e){ db.entries[uid(12)] = { ...e, createdAt: Date.now(), updatedAt: Date.now() }; save(); },
    async update(id, data){ db.entries[id] = { ...db.entries[id], data, updatedAt: Date.now() }; save(); },
    async remove(id){ delete db.entries[id]; save(); }
  };
}

async function FireStore(pid){
  const V = '10.12.2';
  const [{ initializeApp }, fs] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)
  ]);
  const app = window.__fbApp || (window.__fbApp = initializeApp(CFG));
  const db = fs.getFirestore(app);
  const pref = fs.doc(db, 'projects', pid);
  const ecol = fs.collection(db, 'projects', pid, 'entries');
  return {
    async exists(){ const s = await fs.getDoc(pref); return s.exists(); },
    async create(project, seed){
      await fs.setDoc(pref, project);
      for(const s of seed) await fs.addDoc(ecol, { ...s, createdAt: Date.now() });
    },
    listen(fn){
      let project, entries = null;
      const emit = () => { if(project !== undefined && entries) fn({ project, entries }); };
      const u1 = fs.onSnapshot(pref, s => { project = s.exists() ? s.data() : null; emit(); }, e => onErr(e));
      const u2 = fs.onSnapshot(ecol, s => { entries = s.docs.map(d => ({ id: d.id, ...d.data() })); emit(); }, e => onErr(e));
      return () => { u1(); u2(); };
    },
    async setProject(patch){ await fs.setDoc(pref, patch, { merge: true }); },
    async add(e){ await fs.addDoc(ecol, { ...e, createdAt: Date.now(), updatedAt: Date.now() }); },
    async update(id, data){ await fs.updateDoc(fs.doc(ecol, id), { data, updatedAt: Date.now() }); },
    async remove(id){ await fs.deleteDoc(fs.doc(ecol, id)); }
  };
}
function onErr(e){ console.error(e); toast('서버와 연결하지 못했어요. 인터넷 연결과 Firebase 설정을 확인해주세요.'); }

  if(r.page === 'part'){ r.part = PART[h[3]] ? h[3] : 'directing'; r.sec = h[4]; }

}

async function openProject(pid){
  if(S.pid === pid && S.store) return;
  if(S.unsub) S.unsub();
  S.pid = pid; S.loaded = false; S.entries = []; S.project = {};
  S.myPart = (LS.get('mypart') || {})[pid] || null;
  try{ S.store = LIVE ? await FireStore(pid) : LocalStore(pid); }
  catch(e){ console.error(e); $root.innerHTML = `<div class="land"><h1>불러오지 못했어요</h1><p class="lead">Firebase에 연결하지 못했어요. index.html 위쪽의 설정값을 확인해주세요.</p></div>`; return; }
  S.unsub = S.store.listen(({project, entries}) => {
    S.project = project; S.entries = entries; S.loaded = true;
    if(project) rememberProject(pid, project.title);
    render();
  });
  if(!LIVE && !(await S.store.exists())){ S.loaded = true; S.project = null; render(); }
}
function rememberProject(pid, title){

function partSpend(pid){

}

    <div class="bud-row" style="background:var(--surface2);font-weight:700;border-radius:0 0 var(--r) var(--r)"><span>합계</span><span class="faint" style="font-weight:500;font-size:12.5px">${total && sum.a ? (total - sum.a >= 0 ? '배정 안 한 예산 ' + won(total - sum.a) : '배정 합계가 총예산보다 ' + won(sum.a - total) + ' 많아요') : ''}</span><span class="num" style="text-align:right">${won(sum.fixed)}</span><span class="num" style="text-align:right">${won(sum.pending)}</span><span class="num" style="text-align:right">${sum.a ? won(sum.a) : '—'}</span></div>

  <div class="sechead"><h2>전체 지출 내역</h2><span class="sp"></span>
    <div style="display:flex;gap:4px">${['전체','확정','논의 중','취소'].map(x=>`<button class="btn btn-sm ${filter===x?'':'btn-g'}" data-bfilter="${x}">${x}</button>`).join('')}</div></div>

      its.map(e => `<tr class="row" data-open="${e.id}"><td>${esc(e.data.title)}<span class="sub">${esc(p.sections.find(s=>s.id===e.section)?.name||'')}</span></td><td>${p.name}</td><td>${esc(e.data.cat||'')}</td><td><span class="chip ${statusChip(e.data.status)}">${esc(e.data.status||'')}</span></td><td class="r num">${esc(e.data.qty||1)}</td><td class="r num">${won(amount(e.data))}</td></tr>`).join(''); }).join('')}

/* 파트 */
function viewPart(p, secId){
  const sec = p.sections.find(s => s.id === secId) || p.sections[0];
  const mine = canEdit(p.id);
  const list = sortEntries(sec, ofPart(p.id, sec.id));
  const lock = mine ? '' : `<div class="banner lock"><span class="chip c-warn">보기 전용</span><span class="muted">${S.myPart ? `지금 내 파트는 <b>${S.myPart==='all'?'전체':PART[S.myPart].name}</b>예요.` : '아직 내 파트를 고르지 않았어요.'} 이 파트를 쓰려면 내 파트를 <b>${p.name}</b>(으)로 바꾸세요.</span><span class="sp"></span><button class="btn btn-sm" data-setpart="${p.id}">${p.name}(으)로 바꾸기</button></div>`;
  let content = '';
  if(!list.length) content = `<div class="empty"><b>${sec.name}이(가) 비어 있어요</b>${mine ? '첫 항목을 추가해보세요.' : '이 파트 담당자가 채우면 여기에 보여요.'}${mine ? `<br><button class="btn btn-p" data-add>+ 추가</button>` : ''}</div>`;
  else content = ({storyboard:vStory, cards:vCards, mood:vMood, palette:vPalette, table:vTable, board:vBoard, schedule:vSchedule}[sec.view])(sec, list, p);
  const spend = sec.money ? list.filter(e=>e.data.status!=='취소').reduce((a,e)=>a+amount(e.data),0) : 0;
  return `
  <div style="--pc:${p.color}">
    <div class="pagehead"><div><div class="eyebrow"><span class="dot" style="width:8px;height:8px;border-radius:50%;background:${p.color};display:inline-block"></span>파트</div><h1>${p.name}</h1><p class="lead">${p.desc}</p></div>
      <div class="acts">${mine ? `<button class="btn btn-p" data-add>+ ${sec.name} 추가</button>` : ''}</div></div>
    ${lock}
    <div class="tabs" role="tablist">${p.sections.map(s => `<a class="tab ${s.id===sec.id?'on':''}" style="text-decoration:none" href="${link('part',p.id,s.id)}">${s.name}<span class="n">${ofPart(p.id,s.id).length || ''}</span></a>`).join('')}</div>
    ${sec.money && list.length ? `<p class="faint" style="margin:-8px 0 14px;font-size:13px">이 탭의 금액 합계 <b class="num" style="color:var(--ink)">${won(spend)}</b> (취소 제외) · 예산안에 자동으로 반영돼요</p>` : ''}
    ${content}
  </div>`;
}
function sortEntries(sec, list){
  const by = {
    storyboard: (a,b) => (+a.data.scene||0)-(+b.data.scene||0) || (+a.data.cut||0)-(+b.data.cut||0),
    schedule: (a,b) => String(a.data.date||'9').localeCompare(String(b.data.date||'9')),
  }[sec.view];
  return [...list].sort(by || ((a,b) => ((+a.data.order||999) - (+b.data.order||999)) || (a.createdAt||0)-(b.createdAt||0)));
}
const fval = (fd, v) => { if(v == null || v === '' || (Array.isArray(v) && !v.length)) return ''; if(fd.t==='money') return won(v); if(fd.t==='date') return fmtD(v); return arr(v).join(', '); };

function vStory(sec, list){
  const ratio = (S.project.ratio || '16:9').replace(':','/');
  const scenes = {};
  for(const e of list){ const k = +e.data.scene || 0; (scenes[k] = scenes[k] || []).push(e); }
  const total = list.reduce((a,e)=>a+(Number(e.data.sec)||0),0);
  return `<p class="faint" style="margin:-6px 0 16px;font-size:13px">씬 ${Object.keys(scenes).length}개 · 컷 ${list.length}개 · 예상 분량 <b class="num" style="color:var(--ink)">${mmss(total)}</b>${S.project.runtime ? ' / 목표 ' + S.project.runtime + ':00' : ''} · 화면비 ${esc(S.project.ratio||'16:9')}</p>` +
  Object.entries(scenes).map(([no, cuts]) => {
    const head = cuts.find(c => c.data.sceneTitle) || cuts[0];
    const t = cuts.reduce((a,e)=>a+(Number(e.data.sec)||0),0);
    return `<section class="scene"><div class="scene-h"><span class="sn">S#${String(no).padStart(2,'0')}</span><span class="st">${esc(head.data.sceneTitle||'')}</span>${head.data.tod?`<span class="chip">${esc(head.data.tod)}</span>`:''}<span class="sp"></span><span class="faint num" style="font-size:12.5px">${cuts.length}컷 · ${mmss(t)}</span></div>
    <div class="cuts">${cuts.map(e => { const d = e.data, im = imgUrl(d.image);
      return `<button class="card cut" data-open="${e.id}"><div class="frame" style="aspect-ratio:${ratio}">${im?`<img src="${esc(im)}" alt="" loading="lazy">`:'<span class="ph">콘티 그림 없음</span>'}<span class="cn">C${esc(d.cut)}</span></div>
        <div class="b"><div class="tags">${[d.size,d.angle].filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}${arr(d.move).map(x=>`<span class="chip c-mint">${esc(x)}</span>`).join('')}</div>
        <div class="tx">${esc(d.title)}</div>${d.dialogue?`<div class="dl">“${esc(d.dialogue)}”</div>`:''}
        <div class="ft"><span>${esc(d.cast||'')}</span><span class="num">${d.sec? esc(d.sec)+'초':''} ${d.status&&d.status!=='준비'?`<span class="chip ${statusChip(d.status)}">${esc(d.status)}</span>`:''}</span></div></div></button>`; }).join('')}</div></section>`;
  }).join('');
}
function vCards(sec, list){
  return `<div class="gallery">${list.map(e => { const d = e.data, im = imgUrl(d[sec.cover||'image']);
    const chips = sec.fields.filter(x=>x.chip).flatMap(x=>arr(d[x.k]).map(v=>`<span class="chip ${statusChip(v)}">${esc(v)}</span>`)).join('');

      <div class="gbody"><div class="t">${esc(d.title)}</div>${chips?`<div class="chips">${chips}</div>`:''}${lines}${meta?`<div class="mt">${meta}</div>`:''}${money}</div></button>`; }).join('')}</div>`;

function vMood(sec, list){
  return `<div class="mood">${list.map(e => { const im = imgUrl(e.data.image);
    return `<button class="m" data-open="${e.id}">${im?`<img src="${esc(im)}" alt="" loading="lazy">`:'<div class="noimg">이미지 없음</div>'}<div class="cap">${esc(e.data.title)}</div></button>`; }).join('')}</div>`;
}
function vPalette(sec, list){
  return `<div class="palette">${list.map(e => { const d = e.data;
    return `<button class="card sw" data-open="${e.id}"><div class="c" style="background:${/^#[0-9a-f]{3,8}$/i.test(d.color||'')?d.color:'#333'}"></div><div class="i"><b>${esc(d.title)}</b><span>${esc(d.color||'')}${d.role?' · '+esc(d.role):''}</span>${d.usage?`<div class="muted" style="font-size:12.5px;margin-top:4px">${esc(d.usage)}</div>`:''}</div></button>`; }).join('')}</div>`;

function vTable(sec, list){
  const cols = sec.fields.filter(x => x.col);
  const subs = sec.fields.filter(x => x.sub);
  const row = e => `<tr class="row" data-open="${e.id}">${cols.map((c,i) => {
    let v = e.data[c.k];
    if(c.t === 'select' && (c.k==='status'||c.k==='license'||c.k==='prep')) v = v ? `<span class="chip ${statusChip(v)}">${esc(v)}</span>` : '';
    else if(c.t === 'multi') v = arr(v).map(x=>`<span class="chip" style="margin:0 3px 3px 0">${esc(x)}</span>`).join('');
    else v = esc(fval(c, v));
    if(i === 0) v = `<b style="font-weight:600">${v}</b>` + subs.map(s=>e.data[s.k]?`<span class="sub">${esc(e.data[s.k])}</span>`:'').join('');
    return `<td class="${c.t==='money'||c.t==='number'?'r num':''}">${v}</td>`; }).join('')}${sec.money?`<td class="r num"><b>${won(amount(e.data))}</b></td>`:''}</tr>`;
  const ncol = cols.length + (sec.money ? 1 : 0);
  let rows = '';
  if(sec.group){
    const g = {}; for(const e of list){ const k = e.data[sec.group] || '분류 없음'; (g[k] = g[k] || []).push(e); }
    const order = (sec.fields.find(x=>x.k===sec.group)||{}).o || [];
    rows = Object.keys(g).sort((a,b)=>(order.indexOf(a)+1||99)-(order.indexOf(b)+1||99)).map(k => `<tr class="grp"><td colspan="${ncol - (sec.money?1:0)}">${esc(k)} <span class="faint" style="font-weight:500">${g[k].length}</span></td>${sec.money?`<td class="r num">${won(g[k].filter(e=>e.data.status!=='취소').reduce((a,e)=>a+amount(e.data),0))}</td>`:''}</tr>` + g[k].map(row).join('')).join('');
  } else rows = list.map(row).join('');
  return `<div class="tbl-wrap"><table><thead><tr>${cols.map(c=>`<th class="${c.t==='money'||c.t==='number'?'r':''}">${esc(c.l)}</th>`).join('')}${sec.money?'<th class="r">금액</th>':''}</tr></thead><tbody>${rows}</tbody></table></div>`;

function vBoard(sec, list){
  const fd = sec.fields.find(x => x.k === sec.by); const opts = fd.o;
  return `<div class="board" style="--cols:${opts.length}">${opts.map(o => { const its = list.filter(e => (e.data[sec.by] || opts[0]) === o);
    return `<div class="bcol"><h3><span>${esc(o)}</span><span>${its.length}</span></h3>${its.map(e => { const d = e.data; const meta = sec.fields.filter(x=>x.meta).map(x=>fval(x,d[x.k])).filter(Boolean);
      return `<button class="bitem" data-open="${e.id}"><b style="font-weight:600">${esc(d.title)}</b>${meta.length?`<div class="mt">${meta.map(m=>`<span>${esc(m)}</span>`).join('')}</div>`:''}</button>`; }).join('') || '<div class="faint" style="font-size:12.5px;padding:4px 6px">없음</div>'}</div>`; }).join('')}</div>`;
}
function vSchedule(sec, list){
  return `<div class="sched">${list.map(e => { const d = e.data; const past = parseD(d.date) && parseD(d.date) < today();
    return `<button class="card call ${past||d.status==='완료'?'past':''}" data-open="${e.id}"><div class="d"><span class="faint" style="font-size:12px;font-weight:700">${esc(d.title)}</span><b>${esc(fmtD(d.date)||'날짜 미정')}</b><span class="chip ${past?'':'c-mint'}" style="align-self:flex-start">${esc(dday(d.date))}</span></div>
      <div class="i"><b style="font-size:15.5px">${esc(d.location || '로케이션 미정')}</b><div class="row2">${d.call?`<span>콜 ${esc(d.call)}${d.wrap?' – '+esc(d.wrap):''}</span>`:''}${d.meet?`<span>집합 ${esc(d.meet)}</span>`:''}${d.scenes?`<span>씬 ${esc(d.scenes)}</span>`:''}</div>${d.crew?`<div class="muted" style="font-size:13px">${esc(d.crew)}</div>`:''}${d.prep?`<div class="faint" style="font-size:12.5px;white-space:pre-wrap">준비물 · ${esc(d.prep)}</div>`:''}</div></button>`; }).join('')}</div>`;

/* ============================================================
   편집 창
   ============================================================ */
function fieldHTML(fd, v, id){
  const val = v ?? fd.def ?? '';
  const ph = esc(fd.ph || '');
  let inp;
  switch(fd.t){
    case 'textarea': inp = `<textarea id="${id}" name="${fd.k}" placeholder="${ph}">${esc(val)}</textarea>`; break;
    case 'select': inp = `<select id="${id}" name="${fd.k}"><option value=""></option>${fd.o.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`; break;
    case 'multi': inp = `<div class="picks" data-multi="${fd.k}" role="group" aria-label="${esc(fd.l)}">${fd.o.map(o=>`<button type="button" class="${arr(val).includes(o)?'on':''}" aria-pressed="${arr(val).includes(o)}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`; break;
    case 'color': inp = `<div class="colorrow"><input type="color" id="${id}" name="${fd.k}" value="${esc(/^#[0-9a-f]{6}$/i.test(val)?val:'#3b82f6')}"><input type="text" data-hex="${fd.k}" value="${esc(val)}" aria-label="색 코드"></div>`; break;
    case 'image': { const u = imgUrl(val); inp = `<input id="${id}" name="${fd.k}" type="url" value="${esc(val)}" placeholder="https://" data-img><div class="prev" ${u?'':'hidden'}>${u?`<img src="${esc(u)}" alt="">`:''}</div>`; break; }
    default: {
      const type = {number:'number', money:'number', date:'date', time:'time', url:'url'}[fd.t] || 'text';
      inp = `<input id="${id}" name="${fd.k}" type="${type}" ${type==='number'?'inputmode="numeric" min="0"':''} value="${esc(val)}" placeholder="${ph}" autocomplete="off">`;
    }
  }
  const hint = fd.hint || (fd.t === 'image' ? '구글 드라이브 공유 링크(링크가 있는 모든 사용자)나 이미지 주소를 붙여넣으세요' : '');
  const lab = fd.t === 'multi' ? `<span class="lb">${esc(fd.l)}</span>` : `<label for="${id}">${esc(fd.l)}${fd.req?' *':''}</label>`;
  return `<div class="fd ${fd.full || fd.t==='textarea' || fd.t==='multi' || fd.t==='image' ? 'full':''}">${lab}${inp}${hint?`<span class="hint">${esc(hint)}</span>`:''}</div>`;
}
function openDrawer({ title, fields, data, editable, onSave, onDelete, chip }){
  const ov = document.createElement('div'); ov.className = 'ov';
  const body = editable
    ? fields.map(fd => fieldHTML(fd, data[fd.k], 'fd-' + fd.k)).join('')
    : `<dl class="ro">${fields.map(fd => { const v = data[fd.k]; if(fd.t === 'image'){ const u = imgUrl(v); return u ? `<dt>${esc(fd.l)}</dt><dd><img src="${esc(u)}" alt=""></dd>` : ''; }
        if(fd.t === 'url' && v) return `<dt>${esc(fd.l)}</dt><dd><a href="${esc(v)}" target="_blank" rel="noopener">${esc(v)}</a></dd>`;
        const t = fval(fd, v); return t ? `<dt>${esc(fd.l)}</dt><dd>${esc(t)}</dd>` : ''; }).join('')}</dl>`;
  ov.innerHTML = `<div class="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle">
    <header><h3 id="dtitle">${esc(title)}</h3>${chip||''}<button class="btn btn-g btn-sm" data-close aria-label="닫기">✕</button></header>
    <form class="body" novalidate>${body}</form>
    <footer>${editable && onDelete ? '<button class="btn btn-d" data-del type="button">삭제</button>' : ''}<span class="sp"></span><button class="btn btn-g" data-close type="button">${editable?'취소':'닫기'}</button>${editable?'<button class="btn btn-p" data-save type="button">저장</button>':''}</footer></div>`;
  document.body.appendChild(ov);
  const close = () => { ov.remove(); document.removeEventListener('keydown', key); };
  const key = e => { if(e.key === 'Escape') close(); };
  document.addEventListener('keydown', key);
  ov.addEventListener('click', e => { if(e.target === ov || e.target.closest('[data-close]')) close(); });
  const form = ov.querySelector('form');
  form.querySelectorAll('.picks button').forEach(b => b.onclick = () => { b.classList.toggle('on'); b.setAttribute('aria-pressed', b.classList.contains('on')); });
  form.querySelectorAll('[data-img]').forEach(inp => inp.oninput = () => { const u = imgUrl(inp.value); const p = inp.nextElementSibling; p.hidden = !u; p.innerHTML = u ? `<img src="${esc(u)}" alt="">` : ''; });
  form.querySelectorAll('[data-hex]').forEach(t => { const c = form.querySelector(`[name="${t.dataset.hex}"]`); c.oninput = () => t.value = c.value; t.oninput = () => { if(/^#[0-9a-f]{6}$/i.test(t.value)) c.value = t.value; }; });
  setTimeout(() => { const first = form.querySelector('input:not([type=color]),textarea,select'); if(first && editable) first.focus(); }, 40);
  const del = ov.querySelector('[data-del]');
  if(del){ let armed = false; del.onclick = async () => { if(!armed){ armed = true; del.textContent = '한 번 더 누르면 삭제'; return; } try{ await onDelete(); toast('삭제했어요'); close(); }catch(e){ onErr(e); } }; }
  const save = ov.querySelector('[data-save]');
  if(save) save.onclick = async () => {
    const out = {};
    for(const fd of fields){
      if(fd.t === 'multi'){ out[fd.k] = [...form.querySelectorAll(`[data-multi="${fd.k}"] button.on`)].map(b=>b.dataset.v); continue; }
      const el = form.querySelector(`[name="${fd.k}"]`); let v = el ? el.value.trim() : '';
      if(fd.t === 'color'){ const h = form.querySelector(`[data-hex="${fd.k}"]`).value.trim(); v = /^#[0-9a-f]{6}$/i.test(h) ? h : el.value; }
      if(fd.req && !v){ el.focus(); el.style.borderColor = 'var(--bad)'; toast(fd.l + '을(를) 입력해주세요'); return; }
      if((fd.t === 'number' || fd.t === 'money') && v !== '') v = Number(v);
      out[fd.k] = v;
    }
    save.disabled = true;
    try{ await onSave(out); toast('저장했어요'); close(); }catch(e){ onErr(e); save.disabled = false; }
  };
}
function openEntry(id, newIn){
  let e, p, sec;
  if(newIn){ p = newIn.p; sec = newIn.sec; e = { data:{} };
    if(sec.view === 'storyboard'){ const cuts = ofPart(p.id, sec.id); const last = sortEntries(sec, cuts).pop(); e.data.scene = last ? last.data.scene : 1; e.data.cut = last ? (+last.data.cut||0) + 1 : 1; }
    if(sec.fields.some(x=>x.k==='order')) e.data.order = ofPart(p.id, sec.id).length + 1;
  } else { e = S.entries.find(x => x.id === id); if(!e) return; p = PART[e.part]; sec = p.sections.find(s => s.id === e.section); }
  const editable = canEdit(p.id);
  openDrawer({
    title: newIn ? `${sec.name} 추가` : (e.data.title || sec.name),
    chip: `<span class="chip" style="color:${p.color}">${p.name} · ${sec.name}</span>`,
    fields: sec.fields, data: e.data, editable,
    onSave: data => newIn ? S.store.add({ part: p.id, section: sec.id, data }) : S.store.update(id, data),
    onDelete: newIn ? null : () => S.store.remove(id)
  });
}
function openShare(){
  const url = shareUrl();
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="drawer" role="dialog" aria-modal="true"><header><h3>팀에 공유하기</h3><button class="btn btn-g btn-sm" data-close>✕</button></header>
    <div class="body" style="grid-template-columns:1fr"><div class="fd full"><label for="shareurl">프로젝트 링크</label><input id="shareurl" readonly value="${esc(url)}"></div>
    <div class="fd full"><span class="hint">이 링크가 있는 사람은 누구나 보고 고칠 수 있어요. 팀 단톡방에만 공유하고, 공개된 곳에는 올리지 마세요.</span></div>
    ${!LIVE ? `<div class="banner lock" style="margin:0"><span class="muted">지금은 미리보기 모드라 링크를 보내도 팀원에게는 내용이 안 보여요. Firebase를 연결한 뒤 공유하세요.</span></div>` : ''}
    <div class="card" style="padding:14px 16px;font-size:13.5px"><b>팀원에게 알려줄 것</b><ol style="margin:8px 0 0;padding-left:18px;color:var(--muted)"><li>링크를 열고 왼쪽 아래에서 <b>내 파트</b>를 고르기</li><li>내 파트 페이지에서 항목 추가하기</li><li>돈이 드는 건 상태를 '확정'으로 바꾸면 예산안에 반영</li></ol></div></div>
    <footer><span class="sp"></span><button class="btn btn-p" data-copy>링크 복사</button></footer></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', async e => {
    if(e.target === ov || e.target.closest('[data-close]')) ov.remove();
    if(e.target.closest('[data-copy]')){ try{ await navigator.clipboard.writeText(url); toast('링크를 복사했어요'); }catch(_){ const i = ov.querySelector('#shareurl'); i.select(); toast('링크를 선택했어요. 복사해서 붙여넣으세요'); } }
  });
}
function openGuide(){
  const ov = document.createElement('div'); ov.className = 'ov';
  ov.innerHTML = `<div class="drawer guide" role="dialog" aria-modal="true"><header><h3>팀과 함께 쓰려면 (처음 한 번만)</h3><button class="btn btn-g btn-sm" data-close>✕</button></header>
    <div class="body" style="grid-template-columns:1fr"><ol>
      <li><b>Firebase 프로젝트 만들기</b><br><span class="muted">console.firebase.google.com → 프로젝트 추가 (애널리틱스는 꺼도 돼요)</span></li>
      <li><b>Firestore 만들기</b><br><span class="muted">빌드 → Firestore Database → 데이터베이스 만들기 → 위치는 asia-northeast3 (서울)</span></li>
      <li><b>보안 규칙 붙여넣기</b><br><span class="muted">Firestore → 규칙 탭에 함께 드린 <code>firestore.rules</code> 내용을 붙여넣고 게시</span></li>
      <li><b>웹 앱 등록</b><br><span class="muted">프로젝트 설정 → 내 앱 → 웹(&lt;/&gt;) → 나오는 <code>firebaseConfig</code> 값을 index.html 맨 위 설정 칸에 붙여넣기</span></li>
      <li><b>GitHub Pages에 올리기</b><br><span class="muted">GitHub 새 저장소(Public) → index.html 업로드 → Settings → Pages → Branch: main 저장 → 주소가 생겨요</span></li>
      <li><b>새 프로젝트 만들고 링크 공유</b></li>
    </ol></div><footer><span class="sp"></span><button class="btn" data-close>닫기</button></footer></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if(e.target === ov || e.target.closest('[data-close]')) ov.remove(); });
}

/* ============================================================
   이벤트
   ============================================================ */
let allocT;
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-open],[data-add],[data-setpart],[data-bfilter]'); if(!t) { const side = document.getElementById('side'); if(side && side.classList.contains('open') && !e.target.closest('#side')) side.classList.remove('open'); return; }
  if(t.dataset.open){ openEntry(t.dataset.open); return; }
  if(t.hasAttribute('data-add')){ const p = PART[S.route.part]; const sec = p.sections.find(s=>s.id===S.route.sec) || p.sections[0]; openEntry(null, { p, sec }); return; }
  if(t.dataset.setpart){ setMyPart(t.dataset.setpart); toast('내 파트를 ' + PART[t.dataset.setpart].name + '(으)로 바꿨어요'); return; }
  if(t.dataset.bfilter){ S.budgetFilter = t.dataset.bfilter; render(); return; }
  const a = t.dataset.act;
  if(a === 'share') openShare();
  else if(a === 'guide') openGuide();
  else if(a === 'menu') document.getElementById('side').classList.toggle('open');
  else if(a === 'editOverview') openDrawer({ title:'작품 개요 편집', fields: OVERVIEW_FIELDS, data: S.project, editable: true, onSave: d => S.store.setProject(d) });
});
document.addEventListener('input', e => {
  const t = e.target; if(!t.dataset || !t.dataset.alloc) return;
  clearTimeout(allocT);
  allocT = setTimeout(async () => {
    const alloc = { ...(S.project.alloc || {}) };
    document.querySelectorAll('[data-alloc]').forEach(i => { const v = i.value.replace(/[^\d]/g,''); alloc[i.dataset.alloc] = v ? Number(v) : 0; });
    try{ await S.store.setProject({ alloc }); toast('배정 예산을 저장했어요'); }catch(err){ onErr(err); }
  }, 700);
});
document.addEventListener('keydown', e => { if(e.key === 'Enter' && e.target.matches('tr.row')) e.target.click(); });

route();
})();
</script>
